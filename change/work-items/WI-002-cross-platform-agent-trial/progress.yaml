findings:
  - id: F1
    what: "A repeated --role (or --to, --after) kept only the last value; start took one role of three."
    fixed: "thread.mjs parseArgs: list flags add up. Test: --role given more than once."
  - id: F2
    what: "board status at one scope listed merge queues from every source (trial showed master:me)."
    fixed: "status filters queues by the ready note's source. Test: status shows only the merge queues ... in its scope."
  - id: F3
    what: "next --claim took the newest open call first, so a dispatcher's posting order ran backwards."
    fixed: "Tasks are taken oldest first. Test: open calls are taken in the order they were posted."
  - id: F4
    what: "An agent that ran start twice left a second handle on the board, present for 8h, holding nothing."
    fixed: "start names the live handle this workspace already has. Test: start says when this workspace already has a handle."
  - id: F5
    what: "Six agents pushing at once: bye and done printed NOT PUSHED after three immediate retries (cannot lock ref)."
    fixed: "Six attempts with jittered backoff; the warning names thread sync. AGENTS.md: sync, then stop only if it persists."
  - id: F6
    what: "board done <task id> failed (no post t-...); only the post id worked, and next --claim's tip said thread done."
    fixed: "ack resolves a task thread to its open call. Test: done takes the task thread of an open call."
  - id: F7
    what: "accept and done were accepted on a standing order."
    fixed: "Refused with a pointer to ack. Test: a standing order is acknowledged, never accepted or done."
  - id: F8
    what: "A question stayed in the inbox and in status after reply."
    fixed: "reply acknowledges the question as done (answered). Test: replying to a question answers it."
  - id: F9
    what: "Oldest-first alone would leave a dead agent's half-done task behind fresh ones."
    fixed: "Tasks whose claim lapsed rank first. Test: work an agent left is taken before fresh work."
  - id: F10
    what: "Standing orders posted mid-run reached agents only after they opened their PR (titles renamed afterwards)."
    fixed: "AGENTS.md step 4: read the inbox before opening the pull request."
  - id: F11
    what: "Open call and task listed separately looked like 14 items for 7 pieces of work; read-only commands do not push a local commit left behind."
    fixed: null

