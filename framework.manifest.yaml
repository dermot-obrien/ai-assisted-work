#
# Framework manifest — the shared install contract (see @aaw/installer).
# AAW is the base framework: Node tooling, no dependencies.
# `aaw install` reads this to wire AI-tool shims and record itself in the
# .aaw-config.yaml modules registry. For AAW itself, `aaw install` is also the
# interactive workspace bootstrap command.

id: aaw
name: AI-Assisted Work
version: 2.0.0
depends: []
runtime: node
# Shim files reference their source via this path; the installer rewrites it to
# the real relative location (submodule dir or node_modules).
source_token: .ai-assisted-work

# Standalone Agent Skills (agentskills.io). Self-contained, so no source_token
# rewrite applies. Installed to .agents/skills/<name>, which Codex, Cursor, Copilot,
# VS Code and Gemini CLI read natively; .claude/skills/<name> is linked at it because
# Claude Code does not read .agents/skills/.
skills: { src: skills }

# Legacy per-tool command shims. Superseded by `skills` above; retained for installs
# that have not yet moved.
shims:
  claude: { src: skills-for-agents/claude/commands/aaw, dest: .claude/commands/aaw }
  cursor: { src: skills-for-agents/cursor/commands/aaw, dest: .cursor/commands/aaw }
  copilot: { src: skills-for-agents/github/prompts, dest: .github/prompts }
  gemini: { src: skills-for-agents/gemini/skills/aaw, dest: .gemini/skills/aaw }

config: []
data_dirs: []
