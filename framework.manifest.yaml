#
# Framework manifest — the shared install contract (see @aaw/installer).
# AAW is the base framework: Node tooling, no dependencies.
# `aaw install` reads this to install the Agent Skills and record itself in the
# .aaw-config.yaml modules registry. For AAW itself, `aaw install` is also the
# interactive workspace bootstrap command.
#
# There is no `shims` key and no `source_token`. Both existed only for the
# per-tool command shims, retired in 3.0.0. A skill is self-contained and holds
# no path back into the framework, so nothing needs rewriting at install time.

id: aaw
name: AI-Assisted Work
version: 3.2.0
depends: []
runtime: node

# Standalone Agent Skills (agentskills.io). Installed to .agents/skills/<name>,
# which Codex, Cursor, Copilot, VS Code and Gemini CLI read natively;
# .claude/skills/<name> is linked at it because Claude Code does not read
# .agents/skills/.
skills: { src: skills }

config: []
data_dirs: []
