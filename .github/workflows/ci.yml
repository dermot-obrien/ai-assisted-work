name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Work schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The work layer's source of truth is skills/work/assets/work.schema.json (DD-11).
      - name: The progress.yaml templates match the work schema
        run: node scripts/test-work-schema.mjs

  skills:
    name: Agent Skills validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Zero-dependency on purpose, so this job needs no install step.
      - name: Validate skills against the agentskills.io spec
        run: node scripts/validate-skills.mjs skills

      - name: Validate bundle.json against the bundle schema and the skills
        run: node scripts/validate-bundle.mjs .

      - name: The skills installer's tests pass
        run: node --test scripts/test-skills.mjs

      - name: Activity claims on a shared remote exclude each other
        run: node --test scripts/test-claim.mjs

      - name: Install skills into a scratch workspace
        run: |
          mkdir -p /tmp/ws/.claude && cd /tmp/ws && git init -q .
          node "$GITHUB_WORKSPACE/bin/skills.mjs" install --bundle "$GITHUB_WORKSPACE"

      - name: Check the installed skills resolve
        run: |
          node "$GITHUB_WORKSPACE/scripts/validate-skills.mjs" /tmp/ws/.agents/skills
          for s in /tmp/ws/.claude/skills/work; do
            test -f "$s/SKILL.md" || { echo "::error::$s does not resolve"; exit 1; }
          done

      - name: Each skill's post-install check passes in the fresh workspace
        run: node scripts/validate-bundle.mjs --run-checks /tmp/ws .

      - name: A misconfigured workspace fails the checks
        run: |
          echo "deliverables_register: ./missing.yaml" > /tmp/ws/.aaw-config.yaml
          if node scripts/validate-bundle.mjs --run-checks /tmp/ws .; then
            echo "::error::the checks passed with deliverables_register pointing nowhere"; exit 1
          fi
          rm /tmp/ws/.aaw-config.yaml

      - name: A fresh install reports no drift
        run: node "$GITHUB_WORKSPACE/bin/skills.mjs" check --workspace /tmp/ws

      - name: An edited copy is caught
        run: |
          echo "# edited in the workspace" >> /tmp/ws/.agents/skills/work/SKILL.md
          if node "$GITHUB_WORKSPACE/bin/skills.mjs" check --workspace /tmp/ws; then
            echo "::error::check-skills passed on an edited copy"; exit 1
          fi

  skills-ref:
    name: Agent Skills reference validator
    runs-on: ubuntu-latest
    env:
      # skills-ref is the specification's reference library. It is pinned to a commit
      # because it is published for demonstration and its checks may change.
      SKILLS_REF: git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install skills-ref
        run: pip install "skills-ref @ $SKILLS_REF"

      # bundle.json is the list of skills this repository ships, and the "Agent Skills
      # validation" job already fails when it and skills/ disagree. Validating what it
      # lists therefore covers exactly the skills bin/skills.mjs installs.
      - name: Validate every skill bundle.json lists
        run: |
          paths=$(node -e 'for (const s of require("./bundle.json").skills) console.log(s.path)')
          test -n "$paths" || { echo "::error::bundle.json lists no skills"; exit 1; }
          failed=0
          for p in $paths; do
            skills-ref validate "$p" || { echo "::error file=$p/SKILL.md::skills-ref validate failed for $p"; failed=1; }
          done
          exit $failed

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v6

  extract:
    name: Each skill builds as a repository of its own
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the extraction keeps each skill's history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract work, then validate it
        run: |
          git config --global user.name ci && git config --global user.email ci@localhost
          for s in work; do
            node scripts/extract-skill.mjs "$s" "/tmp/extract/$s"
            (cd "/tmp/extract/$s" && node scripts/validate-skills.mjs skills && node scripts/validate-bundle.mjs .)
          done
