name: CI

on:
  push:
    branches: [main, v2-redesign]
  pull_request:
    branches: [main, v2-redesign]

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The work layer's source of truth is schemas/work.schema.json (DD-11).
      - name: The progress.yaml templates match the work schema
        run: node scripts/test-work-schema.mjs

      - name: Typecheck protocol
        working-directory: packages/protocol
        run: npx tsc -p tsconfig.json --noEmit

      # The CLI imports @aaw/protocol and @aaw/installer by package name, which
      # resolve to their dist/ type declarations. Those must be emitted before the
      # CLI can be typechecked at all, or every import reports TS2307 and the
      # inferred types collapse to implicit any.
      - name: Build protocol
        run: npm run build --workspace @aaw/protocol

      - name: Build installer
        run: npm run build --workspace @aaw/installer

      - name: Typecheck installer
        working-directory: packages/installer
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck CLI
        working-directory: packages/cli
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build bundle
        working-directory: packages/cli
        run: npm run bundle

      - name: Verify bundle is up to date
        run: |
          if [ -n "$(git status --porcelain bin/aaw.js)" ]; then
            echo "::error::bin/aaw.js is out of date — run 'cd packages/cli && npm run bundle' and commit the result."
            git diff bin/aaw.js | head -50
            exit 1
          fi

      - name: Smoke test CLI
        run: |
          node bin/aaw.js --version
          node bin/aaw.js --help

  skills:
    name: Agent Skills validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Zero-dependency on purpose, so this job needs no install step.
      - name: Validate skills against the agentskills.io spec
        run: node scripts/validate-skills.mjs skills

      - name: Validate bundle.json against the bundle schema and the skills
        run: node scripts/validate-bundle.mjs .

      - name: The thread script's tests pass
        run: node --test scripts/test-thread.mjs

      - name: The protocol types agree with the work schema
        run: node scripts/check-protocol-schema.mjs

      # Each aaw-* skill ships its own copy of the check, so it is complete on its own.
      - name: The aaw-* post-install checks are one file
        run: |
          for f in skills/aaw-*/bin/check.mjs; do
            cmp skills/aaw-start-work/bin/check.mjs "$f" || { echo "::error::$f differs from skills/aaw-start-work/bin/check.mjs"; exit 1; }
          done

      - name: Install skills into a scratch workspace
        run: |
          mkdir -p /tmp/ws/.claude && cd /tmp/ws && git init -q .
          node "$GITHUB_WORKSPACE/bin/aaw.js" install             --framework "$GITHUB_WORKSPACE" --no-python

      - name: Check the installed skills resolve
        run: |
          node "$GITHUB_WORKSPACE/scripts/validate-skills.mjs" /tmp/ws/.agents/skills
          for s in /tmp/ws/.claude/skills/aaw-*; do
            test -f "$s/SKILL.md" || { echo "::error::$s does not resolve"; exit 1; }
          done

      - name: Each skill's post-install check passes in the fresh workspace
        env:
          THREADS_HOME: /tmp/threads
          THREADS_REMOTE: https://example.invalid/threads.git
        run: node scripts/validate-bundle.mjs --run-checks /tmp/ws .

      - name: A misconfigured workspace fails the checks
        run: |
          echo "work_items_path: ./missing" >> /tmp/ws/.aaw-config.yaml
          if node scripts/validate-bundle.mjs --run-checks /tmp/ws .; then
            echo "::error::the checks passed with work_items_path pointing nowhere"; exit 1
          fi
          sed -i '/^work_items_path: .\/missing$/d' /tmp/ws/.aaw-config.yaml

      - name: A fresh install reports no drift
        run: node "$GITHUB_WORKSPACE/bin/aaw.js" check-skills --workspace /tmp/ws --framework "$GITHUB_WORKSPACE"

      - name: An edited copy is caught
        run: |
          echo "# edited in the workspace" >> /tmp/ws/.agents/skills/aaw-start-work/SKILL.md
          if node "$GITHUB_WORKSPACE/bin/aaw.js" check-skills --workspace /tmp/ws --framework "$GITHUB_WORKSPACE"; then
            echo "::error::check-skills passed on an edited copy"; exit 1
          fi

  skills-ref:
    name: Agent Skills reference validator
    runs-on: ubuntu-latest
    env:
      # skills-ref is the specification's reference library. It is pinned to a commit
      # because it is published for demonstration and its checks may change.
      SKILLS_REF: git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install skills-ref
        run: pip install "skills-ref @ $SKILLS_REF"

      # bundle.json is the list of skills this repository ships, and the "Agent Skills
      # validation" job already fails when it and skills/ disagree. Validating what it
      # lists therefore covers exactly the skills aaw install places.
      - name: Validate every skill bundle.json lists
        run: |
          paths=$(node -e 'for (const s of require("./bundle.json").skills) console.log(s.path)')
          test -n "$paths" || { echo "::error::bundle.json lists no skills"; exit 1; }
          failed=0
          for p in $paths; do
            skills-ref validate "$p" || { echo "::error file=$p/SKILL.md::skills-ref validate failed for $p"; failed=1; }
          done
          exit $failed

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v6
