<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The skill bundles: what exists, what is needed, and how they depend on each other</title>
  <desc>Five layers from foundations to solutions. Foundations hold the installer, the diagram model and the deck renderer. Method bundles hold pattern, planning, research, work and thread. The architecture catalogue is the AI-Assisted Architecture bundle. A scaffolding toolkit is needed above it. Solutions, the repositories that install the bundles, sit at the top. Dependencies point downward only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A4A66"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A94A6"/>
    </marker>
    <style>
      .layer { font-size: 13px; font-weight: 600; fill: #1B2A4A; }
      .rule { font-size: 11px; fill: #5A6A86; }
      .bundle { fill: #FFFFFF; stroke: #1B2A4A; stroke-width: 1.4; rx: 6; }
      .bundle-needed { fill: #FFFFFF; stroke: #2A4CDB; stroke-width: 1.4; stroke-dasharray: 6 3; rx: 6; }
      .bundle-local { fill: #F3F4F7; stroke: #8A94A6; stroke-width: 1.2; rx: 6; }
      .skill { fill: #EEF2FB; stroke: #1B2A4A; stroke-width: 1; rx: 4; }
      .skill-needed { fill: #FFFFFF; stroke: #2A4CDB; stroke-width: 1; stroke-dasharray: 4 2; rx: 4; }
      .skill-local { fill: #F3F4F7; stroke: #8A94A6; stroke-width: 1; rx: 4; }
      .name { font-size: 13px; font-weight: 600; fill: #1B2A4A; }
      .name-needed { font-size: 13px; font-weight: 600; fill: #2A4CDB; }
      .repo { font-size: 10px; fill: #5A6A86; font-family: Consolas, Menlo, monospace; }
      .q { font-size: 11px; fill: #3A4A66; }
      .sk { font-size: 10px; fill: #1B2A4A; font-family: Consolas, Menlo, monospace; }
      .sk-needed { font-size: 10px; fill: #2A4CDB; font-family: Consolas, Menlo, monospace; }
      .rel { font-size: 11px; fill: #3A4A66; }
      .rel-bg { fill: #FFFFFF; }
      .line { stroke: #3A4A66; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
      .line-dashed { stroke: #8A94A6; stroke-width: 1.2; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrow-dashed); }
      .title { font-size: 18px; font-weight: 600; fill: #1B2A4A; }
      .subtitle { font-size: 12px; fill: #5A6A86; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#FFFFFF"/>
  <text x="24" y="32" class="title">The skill bundles: what exists, what is needed, and how they depend on each other</text>
  <text x="24" y="52" class="subtitle">Dependencies point down only. Each skill is complete on its own; a repository composes the bundles it wants in .agents/skills.json and answers each skill's bindings in .agents/skill-bindings.toml.</text>

  <!-- Layer bands -->
  <rect x="20" y="70" width="1360" height="122" fill="#FFF4E8" rx="8"/>
  <rect x="20" y="200" width="1360" height="122" fill="#F3F0FB" rx="8"/>
  <rect x="20" y="330" width="1360" height="142" fill="#EDF7F4" rx="8"/>
  <rect x="20" y="480" width="1360" height="142" fill="#EEF2FB" rx="8"/>
  <rect x="20" y="630" width="1360" height="112" fill="#F3F4F7" rx="8"/>

  <text x="32" y="92" class="layer">L4 Solutions</text>
  <text x="32" y="110" class="rule">Repositories that install</text>
  <text x="32" y="124" class="rule">bundles and bind them.</text>
  <text x="32" y="138" class="rule">Architecture leads;</text>
  <text x="32" y="152" class="rule">implementation links back.</text>

  <text x="32" y="222" class="layer">L3 Scaffolding</text>
  <text x="32" y="240" class="rule">Needed. Composes the</text>
  <text x="32" y="254" class="rule">bundles below into a new</text>
  <text x="32" y="268" class="rule">repository, and keeps two</text>
  <text x="32" y="282" class="rule">repositories aligned.</text>

  <text x="32" y="352" class="layer">L2 Catalogue</text>
  <text x="32" y="370" class="rule">The architecture artefacts</text>
  <text x="32" y="384" class="rule">and their definitions, from</text>
  <text x="32" y="398" class="rule">landscape to node.</text>

  <text x="32" y="502" class="layer">L1 Method</text>
  <text x="32" y="520" class="rule">How work, research,</text>
  <text x="32" y="534" class="rule">patterns and planning</text>
  <text x="32" y="548" class="rule">are done. Each stands</text>
  <text x="32" y="562" class="rule">alone.</text>

  <text x="32" y="652" class="layer">L0 Foundations</text>
  <text x="32" y="670" class="rule">Installer, bundle format,</text>
  <text x="32" y="684" class="rule">the diagram model and</text>
  <text x="32" y="698" class="rule">the deck renderer.</text>

  <!-- L4 Solutions -->
  <g>
    <rect x="210" y="90" width="220" height="88" class="bundle"/>
    <text x="220" y="110" class="name">patternode-architecture</text>
    <text x="220" y="126" class="repo">patternode/</text>
    <text x="220" y="144" class="q">The exemplar: a platform architecture</text>
    <text x="220" y="160" class="q">repository. The house profile.</text>
  </g>
  <g>
    <rect x="442" y="90" width="220" height="88" class="bundle"/>
    <text x="452" y="110" class="name">patternode-platform</text>
    <text x="452" y="126" class="repo">patternode/</text>
    <text x="452" y="140" class="q">Implementation: hexagonal contexts.</text>
    <rect x="452" y="148" width="100" height="16" class="skill-local"/><text x="456" y="160" class="sk">gifs-trading-ops</text>
    <text x="452" y="172" class="q" font-size="9">and reconciliation-archive (repo-local)</text>
  </g>
  <g>
    <rect x="674" y="90" width="220" height="88" class="bundle"/>
    <text x="684" y="110" class="name">knowledge-store</text>
    <text x="684" y="126" class="repo">patternode/knowledge-store</text>
    <text x="684" y="144" class="q">A public product: ontology-typed graph</text>
    <text x="684" y="158" class="q">and chat on AWS. patternode-platform</text>
    <text x="684" y="172" class="q">consumes it as a pinned module.</text>
  </g>
  <g>
    <rect x="906" y="90" width="220" height="88" class="bundle"/>
    <text x="916" y="110" class="name">life-guide-internal</text>
    <text x="916" y="126" class="repo">patternode/</text>
    <text x="916" y="144" class="q">Implementation and architecture docs</text>
    <text x="916" y="158" class="q">in one repository. Installs work</text>
    <text x="916" y="172" class="q">and thread only.</text>
  </g>
  <g>
    <rect x="1138" y="90" width="237" height="88" class="bundle-needed"/>
    <text x="1148" y="110" class="name-needed">The next solution</text>
    <text x="1148" y="126" class="repo">architecture + implementation</text>
    <text x="1148" y="144" class="q">Scaffolded from the house profile,</text>
    <text x="1148" y="158" class="q">aligned by construction, kept</text>
    <text x="1148" y="172" class="q">aligned by reconcile.</text>
  </g>

  <!-- L3 Scaffolding -->
  <g>
    <rect x="210" y="220" width="360" height="84" class="bundle-needed"/>
    <text x="222" y="240" class="name-needed">scaffold-architecture</text>
    <text x="222" y="256" class="q">A profile in, a repository out: folders by level, bindings,</text>
    <text x="222" y="272" class="q">skills.json, house templates, identifier register, the site.</text>
    <text x="222" y="288" class="q">The profile is taken from the exemplar, never built in.</text>
  </g>
  <g>
    <rect x="590" y="220" width="370" height="84" class="bundle-needed"/>
    <text x="602" y="240" class="name-needed">scaffold-implementation</text>
    <text x="602" y="256" class="q">Contexts and services from the catalogue in, a hexagonal</text>
    <text x="602" y="272" class="q">skeleton out: contract, domain, adapters, service module,</text>
    <text x="602" y="288" class="q">one composition root per deployable. Java or Python.</text>
  </g>
  <g>
    <rect x="980" y="220" width="395" height="84" class="bundle-needed"/>
    <text x="992" y="240" class="name-needed">reconcile</text>
    <text x="992" y="256" class="q">Architecture against implementation, both ways: contexts,</text>
    <text x="992" y="272" class="q">services, contracts and nodes. A drift report, run in CI,</text>
    <text x="992" y="288" class="q">that fails when a deployable has no catalogue entry.</text>
  </g>

  <!-- L2 Catalogue: AAA -->
  <g>
    <rect x="210" y="350" width="1165" height="106" class="bundle"/>
    <text x="222" y="370" class="name">ai-assisted-architecture (AAA)</text>
    <text x="440" y="370" class="repo">dermot-obrien/ai-assisted-architecture</text>
    <text x="700" y="370" class="q">Nine skills today, three needed. The continuum page holds the definitions every skill conforms to.</text>
    <rect x="222" y="382" width="130" height="20" class="skill"/><text x="228" y="396" class="sk">aaa-create-strategy</text>
    <rect x="358" y="382" width="130" height="20" class="skill"/><text x="364" y="396" class="sk">aaa-create-platform</text>
    <rect x="494" y="382" width="142" height="20" class="skill"/><text x="500" y="396" class="sk">aaa-create-capability</text>
    <rect x="642" y="382" width="124" height="20" class="skill"/><text x="648" y="396" class="sk">aaa-create-context</text>
    <rect x="772" y="382" width="100" height="20" class="skill"/><text x="778" y="396" class="sk">aaa-create-abb</text>
    <rect x="878" y="382" width="100" height="20" class="skill"/><text x="884" y="396" class="sk">aaa-create-sbb</text>
    <rect x="984" y="382" width="124" height="20" class="skill"/><text x="990" y="396" class="sk">aaa-create-service</text>
    <rect x="1114" y="382" width="162" height="20" class="skill"/><text x="1120" y="396" class="sk">aaa-create-runtime-agent</text>
    <rect x="1282" y="382" width="66" height="20" class="skill"/><text x="1288" y="396" class="sk">aaa-rung</text>
    <rect x="222" y="410" width="124" height="20" class="skill-needed"/><text x="228" y="424" class="sk-needed">aaa-create-product</text>
    <rect x="352" y="410" width="112" height="20" class="skill-needed"/><text x="358" y="424" class="sk-needed">aaa-create-node</text>
    <rect x="470" y="410" width="100" height="20" class="skill-needed"/><text x="476" y="424" class="sk-needed">aaa-landscape</text>
    <text x="582" y="424" class="q">Product: the consumable offering a team runs. Node: where a service runs. Landscape: layers of platforms, from the deck model.</text>
    <text x="222" y="446" class="q">Carries: the standards each skill reads, the front matter schemas, the architecture ontology (extends the work ontology), the definition ladder, and docs/continuum.md.</text>
  </g>

  <!-- L1 Method bundles -->
  <g>
    <rect x="210" y="500" width="280" height="104" class="bundle"/>
    <text x="222" y="520" class="name">architecture-pattern</text>
    <text x="222" y="536" class="repo">dermot-obrien/architecture-pattern</text>
    <rect x="222" y="546" width="58" height="20" class="skill"/><text x="228" y="560" class="sk">pattern</text>
    <rect x="286" y="546" width="64" height="20" class="skill"/><text x="292" y="560" class="sk">use-case</text>
    <rect x="356" y="546" width="106" height="20" class="skill"/><text x="362" y="560" class="sk">cross-reference</text>
    <text x="222" y="586" class="q">One document is the model and the deck.</text>
    <text x="222" y="600" class="q">Patterns at any scope; types optional.</text>
  </g>
  <g>
    <rect x="505" y="500" width="160" height="104" class="bundle"/>
    <text x="517" y="520" class="name">delivery-planning</text>
    <text x="517" y="536" class="repo">dermot-obrien/</text>
    <rect x="517" y="546" width="112" height="20" class="skill"/><text x="523" y="560" class="sk">quarter-planning</text>
    <text x="517" y="586" class="q">Plans a quarter from the</text>
    <text x="517" y="600" class="q">registers and the ladder.</text>
  </g>
  <g>
    <rect x="680" y="500" width="230" height="104" class="bundle"/>
    <text x="692" y="520" class="name">ai-assisted-research</text>
    <text x="692" y="536" class="repo">dermot-obrien/ai-assisted-research</text>
    <rect x="692" y="546" width="62" height="20" class="skill"/><text x="698" y="560" class="sk">research</text>
    <rect x="760" y="546" width="138" height="20" class="skill"/><text x="766" y="560" class="sk">literature-discovery</text>
    <text x="692" y="586" class="q">Hypothesis tree and research</text>
    <text x="692" y="600" class="q">lineage.</text>
  </g>
  <g>
    <rect x="925" y="500" width="140" height="104" class="bundle"/>
    <text x="937" y="520" class="name">ai-assisted-work</text>
    <text x="937" y="536" class="repo">dermot-obrien/</text>
    <rect x="937" y="546" width="44" height="20" class="skill"/><text x="943" y="560" class="sk">work</text>
    <text x="937" y="586" class="q">Work items, activities,</text>
    <text x="937" y="600" class="q">tasks, initiatives.</text>
  </g>
  <g>
    <rect x="1080" y="500" width="140" height="104" class="bundle"/>
    <text x="1092" y="520" class="name">threads</text>
    <text x="1092" y="536" class="repo">dermot-obrien/threads</text>
    <rect x="1092" y="546" width="50" height="20" class="skill"/><text x="1098" y="560" class="sk">thread</text>
    <text x="1092" y="586" class="q">Tree of intents and the</text>
    <text x="1092" y="600" class="q">agents' bulletin board.</text>
  </g>
  <g>
    <rect x="1235" y="500" width="140" height="104" class="bundle-local"/>
    <text x="1247" y="520" class="name">landscape deck</text>
    <text x="1247" y="536" class="repo">dermot-obrien/ai-for-ea</text>
    <text x="1247" y="556" class="q">Layers, platforms, blocks,</text>
    <text x="1247" y="570" class="q">connections, waves, in CSV.</text>
    <text x="1247" y="586" class="q">A tool, not yet a skill.</text>
    <text x="1247" y="600" class="q">Source of aaa-landscape.</text>
  </g>

  <!-- L0 Foundations -->
  <g>
    <rect x="210" y="650" width="710" height="74" class="bundle"/>
    <text x="222" y="670" class="name">ai-assisted-work: the installer and the bundle format</text>
    <text x="222" y="686" class="repo">bin/skills.mjs · bundle.json schema · skills.json and skills.lock.json · the work ontology</text>
    <text x="222" y="704" class="q">One zero-dependency script installs any skill from any bundle or repository and pins the commit.</text>
  </g>
  <g>
    <rect x="935" y="650" width="215" height="74" class="bundle"/>
    <text x="947" y="670" class="name">diagram-model</text>
    <text x="947" y="686" class="repo">dermot-obrien/diagram-model</text>
    <rect x="947" y="694" width="48" height="20" class="skill"/><text x="953" y="708" class="sk">model</text>
    <text x="1003" y="708" class="q">Tables to diagram.</text>
  </g>
  <g>
    <rect x="1165" y="650" width="210" height="74" class="bundle"/>
    <text x="1177" y="670" class="name">markdown-deck</text>
    <text x="1177" y="686" class="repo">dermot-obrien/markdown-deck</text>
    <rect x="1177" y="694" width="100" height="20" class="skill"/><text x="1183" y="708" class="sk">markdown-deck</text>
    <text x="1285" y="708" class="q">Slides and PDF.</text>
  </g>

  <!-- Dependencies -->
  <path d="M 330 604 L 1000 650" class="line"/>
  <rect x="440" y="616" width="196" height="14" class="rel-bg"/><text x="443" y="627" class="rel">pattern and use-case run model</text>
  <path d="M 420 604 L 1240 650" class="line"/>
  <rect x="900" y="634" width="118" height="14" class="rel-bg"/><text x="903" y="645" class="rel">and markdown-deck</text>
  <path d="M 917 456 L 917 648" class="line"/>
  <rect x="760" y="466" width="196" height="14" class="rel-bg"/><text x="763" y="477" class="rel">the ontology extends the work ontology</text>
  <path d="M 300 456 L 300 498" class="line-dashed"/>
  <rect x="306" y="470" width="196" height="14" class="rel-bg"/><text x="309" y="481" class="rel">aaa-rung reads pattern front matter</text>
  <path d="M 585 498 L 585 458" class="line-dashed"/>
  <rect x="591" y="486" width="166" height="14" class="rel-bg"/><text x="594" y="497" class="rel">reads the ladder and registers</text>

  <path d="M 390 304 L 390 348" class="line-dashed"/>
  <path d="M 775 304 L 775 348" class="line-dashed"/>
  <path d="M 1177 304 L 1177 348" class="line-dashed"/>
  <rect x="398" y="316" width="230" height="14" class="rel-bg"/><text x="401" y="327" class="rel">composes every bundle into a skills.json</text>
  <rect x="783" y="316" width="166" height="14" class="rel-bg"/><text x="786" y="327" class="rel">reads contexts and services</text>
  <rect x="1185" y="316" width="150" height="14" class="rel-bg"/><text x="1188" y="327" class="rel">reads the service register</text>

  <path d="M 320 178 L 320 218" class="line-dashed"/>
  <rect x="328" y="186" width="110" height="14" class="rel-bg"/><text x="331" y="197" class="rel">is the house profile</text>
  <path d="M 1256 178 L 1256 218" class="line-dashed"/>
  <rect x="1264" y="186" width="92" height="14" class="rel-bg"/><text x="1267" y="197" class="rel">scaffolded from</text>
  <path d="M 600 178 L 1040 218" class="line-dashed"/>
  <rect x="760" y="182" width="112" height="14" class="rel-bg"/><text x="763" y="193" class="rel">reconciled against</text>

  <!-- Legend -->
  <g>
    <rect x="20" y="760" width="1360" height="120" fill="#FFFFFF" stroke="#D6DAE3" rx="8"/>
    <text x="36" y="784" class="name">Legend and rules</text>
    <rect x="36" y="796" width="70" height="18" class="bundle"/><text x="114" y="809" class="q">exists today</text>
    <rect x="210" y="796" width="70" height="18" class="bundle-needed"/><text x="288" y="809" class="q">needed</text>
    <rect x="360" y="796" width="70" height="18" class="bundle-local"/><text x="438" y="809" class="q">repository-local, or a tool that is not yet a skill</text>
    <line x1="760" y1="805" x2="820" y2="805" class="line"/><text x="828" y="809" class="q">hard dependency: the skill stops without it</text>
    <line x1="1100" y1="805" x2="1160" y2="805" class="line-dashed"/><text x="1168" y="809" class="q">reads, or composes</text>
    <text x="36" y="838" class="q">1. A bundle depends only on bundles in the layers below it, and never on a repository above it. 2. A skill carries its method and its standards; where artefacts live is the repository's to declare.</text>
    <text x="36" y="856" class="q">3. The catalogue layer owns the definitions (the continuum); method bundles do not redefine them. 4. The scaffolding layer holds no layout of its own: it copies the house profile from the exemplar.</text>
    <text x="36" y="872" class="q">5. A new solution is two repositories, architecture and implementation, aligned by construction and checked by reconcile.</text>
  </g>
</svg>
