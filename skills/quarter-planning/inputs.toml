#
# What this skill needs to know about the workspace it is planning. Answer in
# [suite.quarter-planning] of the workspace's .agents/skill-bindings.toml. The six paths
# marked required have no default: a default would be whichever workspace this skill was
# written in, carried around inside it and wrong everywhere else. An unbound run names the
# keys it is waiting for and stops.
#
# Paths resolve against the binding file's own directory, never the working directory,
# and may carry {quarter}, replaced by the quarter slug, so one binding covers every
# quarter. Run `quarter.py --quarter <slug> --where` to see what a binding resolves to
# before reading anything.
#
# What is NOT here, deliberately: working days, focus factor, expected absence, points
# per person-day, capacity totals. Those are not configuration. They change every
# quarter, they need their reasoning recorded beside them, and an assumption buried in
# a config file is an assumption nobody argues with. They live as rows in the planning
# basis register this binding points at, each with the working it came from.

[inputs]
short_description = "Where this workspace keeps the registers a quarter is planned from"

[inputs.options.basis]
type = "path"
required = true
description = """The planning basis: one row per assumption, as parameter, value, unit and
the reasoning behind it. This is where working_days, usable_fraction,
person_days_per_point and expected_absence_days_per_person are stated, and where the
quarter declares the three totals the registers must reproduce."""

[inputs.options.calendar]
type = "path"
required = true
description = """The quarter's periods and their working days. Public holidays and any
shutdown are whatever the weekdays in the range exceed the working days declared here, so
a workspace states its own non-working time without this skill knowing any jurisdiction's
holidays."""

[inputs.options.resourcing]
type = "path"
required = true
description = """Who is on the quarter: allocation, their own leave in working days, the
share of their allocation given to each work item, and whether that share counts against
the capacity being budgeted."""

[inputs.options.sources]
type = "path"
required = true
description = "The model sources. work_item.yaml and work_plan.yaml are read from here."

[inputs.options.register]
type = "path"
required = true
description = """The deliverable type register, for base_story_points per type. This is what
makes a named product have a size without anyone estimating it again."""

[inputs.options.quarterDir]
type = "path"
required = true
description = "The quarter's folder, used to confirm the quarter exists before reading."

[inputs.options.slugPattern]
type = "str"
required = false
default = '^fy(?P<fy>\d{2})-q(?P<q>[1-4])$'
description = """How a quarter slug is shaped, as a regex with named groups. Write it as a
TOML literal string, in single quotes, because a regex carries backslashes. The groups
feed quarterLabel, so a workspace whose quarters are named 2027Q1 or FY27Q1 says so here
rather than renaming its folders. The default assumes a fiscal year, so `--where` notes
when a workspace has not declared its own."""

[inputs.options.quarterLabel]
type = "str"
required = false
default = "Q{q}-FY{fy}"
description = """How the slug's groups compose into the label the model records on a work
item. Fields are the named groups of slugPattern."""

[inputs.options.tolerance]
type = "str"
required = false
default = "0.05"
description = """How far two figures may differ before the integrity sections call it a
disagreement. Points are carried unrounded and compared once, so this absorbs float
representation, not real drift."""

[inputs.options.playbook]
type = "path"
required = false
description = """The workspace's own planning playbook, if it has one: the document this
skill's mechanics serve. Named so the skill can point a reader at it instead of describing
a method the workspace may have decided differently."""

[inputs.options.commands]
type = "table"
required = false
description = """The workspace's own commands, by role, so the skill can tell someone what
to run without knowing whether this workspace uses npm, make or a script. Roles it names:
`regenerate` (rebuild the views derived from the model), `check` (fail on prose that
disagrees with them), `compose` (rebuild the composed model from its sources), `cards`
(regenerate the epic cards, named in each card's generated-file notice). Anything not set
is described rather than commanded."""

[inputs.options.approvalStages]
type = "str"
required = false
default = "draft,sized,validated,approved"
description = """The approval stages a plan, an epic and a product move through, least
advanced first and comma-separated. Each is recorded in an `approval` field on the model
record it approves. The last stage is read as approval, and approval is commitment, so a
workspace that names its stages differently still gets the same rules."""

[inputs.options.ladder]
type = "path"
required = false
description = """The definition ladder, as a CSV with the columns rung, name and description,
one row per rung in ascending order, least defined first. Bound, it turns an epic's framing
into a check: a flow's rung_from and rung_to must be rungs the ladder names, a movement may
not go down it, and the register's optional `rung` column says which rung each product type
evidences. Unbound, flows are reported as recorded and nothing is judged."""

[inputs.options.epicsDir]
type = "path"
required = false
description = """The folder holding each epic's own hand-written folder, which lives across
quarters and holds its framing, scope decisions and discovery. An epic's `home` field names
its folder under here, and its generated card links to that folder's index.md, or README.md
where that is what exists."""

[inputs.options.cardsDir]
type = "path"
required = false
description = """Where `--cards` writes the generated epic cards, one <id>.md per committed
epic, and README.md holding the stage grid. Usually carries {quarter}, because a card is a
view of one quarter. Written, not read, so it need not exist before the first run."""

[inputs.options.workItemsDir]
type = "path"
required = false
description = """The AAW work items folder. Bound, every <workItemsDir>/*/progress.yaml with
work_item_level: epic and a planning_period equal to the quarter's label is read as an epic,
alongside work_item.yaml. Where both hold the same id, the work_item.yaml record wins and the
clash is reported."""
